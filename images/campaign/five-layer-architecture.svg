<svg viewBox="0 0 1320 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Time Affinity's five-layer architecture: the Data Layer feeds the Prediction Layer, which feeds the Reasoning and Explainability Layer, which feeds a reusable Output API, which the Execution Layer calls inside UCLM; campaign results loop back to the Data Layer as feedback.">
<rect x="0" y="0" width="1320" height="330" fill="#FFFFFF"/>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/>
  </marker>
</defs>
<text x="40" y="40" text-anchor="start" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#6B7280">TIME AFFINITY — FIVE-LAYER ARCHITECTURE</text>
<rect x="50.0" y="110" width="220" height="130" rx="8" fill="#F8FAFC" stroke="#059669" stroke-width="1.7"/><text x="160.0" y="144" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1F2937">Data Layer</text><text x="160.0" y="164" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#6B7280">Feature store</text><text x="160.0" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#6B7280">Campaign feedback loop</text>
<line x1="270.0" y1="175.0" x2="300.0" y2="175.0" stroke="#1F2937" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="300.0" y="110" width="220" height="130" rx="8" fill="#F8FAFC" stroke="#059669" stroke-width="1.7"/><text x="410.0" y="144" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1F2937">Prediction Layer</text><text x="410.0" y="164" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#6B7280">Time Affinity Model</text><text x="410.0" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#6B7280">best time / day / window</text>
<line x1="520.0" y1="175.0" x2="550.0" y2="175.0" stroke="#1F2937" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="550.0" y="110" width="220" height="130" rx="8" fill="#F8FAFC" stroke="#059669" stroke-width="1.7"/><text x="660.0" y="144" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1F2937">Reasoning &amp;</text><text x="660.0" y="164" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#6B7280">Explainability Layer</text><text x="660.0" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#6B7280">why this window, which signals</text>
<line x1="770.0" y1="175.0" x2="800.0" y2="175.0" stroke="#1F2937" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="800.0" y="110" width="220" height="130" rx="8" fill="#F8FAFC" stroke="#059669" stroke-width="1.7"/><text x="910.0" y="144" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1F2937">Output Layer</text><text x="910.0" y="164" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#6B7280">Standard reusable API</text><text x="910.0" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#6B7280">per customer identifier</text>
<line x1="1020.0" y1="175.0" x2="1050.0" y2="175.0" stroke="#1F2937" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="1050.0" y="110" width="220" height="130" rx="8" fill="#F8FAFC" stroke="#059669" stroke-width="1.7"/><text x="1160.0" y="144" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1F2937">Execution Layer</text><text x="1160.0" y="164" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#6B7280">UCLM platform integration</text><text x="1160.0" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#6B7280">setup, A/B test, reporting</text>
<polyline points="1160.0,240 1160.0,310 160.0,310 160.0,240" fill="none" stroke="#6B7280" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
<text x="660.0" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6B7280">campaign feedback loop — execution results retrain the model</text>
</svg>