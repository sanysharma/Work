<svg viewBox="0 0 1320 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Design process: an open forum discussion diverges into parallel explorations pulled between product's engine-first instinct and design's consumable-UX push, benchmarked against MoEngage and CleverTap, converging into a refined Growth Manager flow that loops back as the next module starts.">
<rect x="0" y="0" width="1320" height="560" fill="#FFFFFF"/>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/>
  </marker>
</defs>
<rect x="20" y="235" width="170" height="90" rx="8" fill="#F8FAFC" stroke="#1F2937" stroke-width="1.6"/><text x="105.0" y="277.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1F2937">Open forum</text><text x="105.0" y="295.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5" fill="#6B7280">product + eng + AI lead</text>
<polyline points="190,280 240,60 260,60" fill="none" stroke="#94A3B8" stroke-width="1.4"/>
<rect x="260" y="20" width="210" height="80" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.6"/><text x="365.0" y="57.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1F2937">AI autonomy</text><text x="365.0" y="75.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5" fill="#6B7280">how much the agent decides</text>
<polyline points="190,280 240,280 260,280" fill="none" stroke="#94A3B8" stroke-width="1.4"/>
<rect x="260" y="240" width="210" height="80" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.6"/><text x="365.0" y="277.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1F2937">Transparency</text><text x="365.0" y="295.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5" fill="#6B7280">how much reasoning to show</text>
<polyline points="190,280 240,500 260,500" fill="none" stroke="#94A3B8" stroke-width="1.4"/>
<rect x="260" y="460" width="210" height="80" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.6"/><text x="365.0" y="497.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1F2937">Input model</text><text x="365.0" y="515.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5" fill="#6B7280">date + time, one decision?</text>
<line x1="470" y1="280" x2="590" y2="280" stroke="#94A3B8" stroke-width="1.4" marker-end="url(#arrow)"/>
<polyline points="470,60 550,60 550,260 590,260" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow)"/>
<text x="550" y="152.0" text-anchor="end" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#2563EB">Product pulls:</text>
<text x="550" y="168.0" text-anchor="end" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#2563EB">best-in-class engine, UX cost secondary</text>
<polyline points="470,500 550,500 550,300 590,300" fill="none" stroke="#E11D48" stroke-width="2" marker-end="url(#arrow)"/>
<text x="550" y="396.0" text-anchor="end" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#E11D48">Design pulls:</text>
<text x="550" y="416.0" text-anchor="end" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#E11D48">a flow the GM can consume without training</text>
<rect x="590" y="235" width="190" height="90" rx="8" fill="#F8FAFC" stroke="#0F172A" stroke-width="1.6"/><text x="685.0" y="277.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0F172A">Converge</text><text x="685.0" y="295.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5" fill="#6B7280">one refined flow for the GM</text>
<line x1="780" y1="280" x2="880" y2="280" stroke="#1F2937" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="880" y="235" width="170" height="90" rx="8" fill="#F8FAFC" stroke="#1F2937" stroke-width="1.6"/><text x="965.0" y="277.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1F2937">Benchmark</text><text x="965.0" y="295.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5" fill="#6B7280">vs MoEngage, CleverTap</text>
<line x1="1050" y1="280" x2="1120" y2="280" stroke="#1F2937" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="1120" y="235" width="200" height="90" rx="8" fill="#F8FAFC" stroke="#0F172A" stroke-width="1.6"/><text x="1220.0" y="277.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0F172A">Refined flow</text><text x="1220.0" y="295.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5" fill="#6B7280">→ module design handoff</text>
<polyline points="1220,325 1220,545 105,545 105,325" fill="none" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
<text x="662.5" y="535" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6B7280">next module repeats the same loop</text>
</svg>